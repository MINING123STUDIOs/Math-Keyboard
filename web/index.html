<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TM0 Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Load Panel -->
<div id="load-panel">
    <h1>TM0 Visualizer</h1>
    <p>Load a .tm0 file, paste source, write assembly, or use the high-level IR</p>

    <div id="load-tabs">
        <button class="tab active" data-tab="file">.tm0 File</button>
        <button class="tab" data-tab="source">TM0 Source</button>
        <button class="tab" data-tab="asm">Assembly</button>
        <button class="tab" data-tab="ir">IR (tm0ir)</button>
    </div>

    <div id="tab-file" class="tab-content active">
        <div id="drop-zone" onclick="document.getElementById('file-input').click()">
            Drop .tm0 file here or click to browse
        </div>
        <input type="file" id="file-input" accept=".tm0,.asm,.tm0asm">
        <div id="load-actions">
            <button id="btn-load-example" title="Load the Thue-Morse sequence generator">Load Thue-Morse</button>
        </div>
    </div>

    <div id="tab-source" class="tab-content">
        <textarea id="source-editor" spellcheck="false" placeholder="Paste TM0 source here..."></textarea>
        <div id="editor-actions">
            <button id="btn-load-source">Load Source</button>
        </div>
    </div>

    <div id="tab-asm" class="tab-content">
        <textarea id="asm-editor" spellcheck="false" placeholder="; Paste assembly code here...&#10;start:&#10;    on 1: write 1, move R, goto next&#10;    on 0: write 0, move R, goto next"></textarea>
        <div id="asm-actions">
            <button id="btn-asm-compile">Compile &amp; Run</button>
            <button id="btn-asm-to-tm0" title="Compile and show the TM0 output">Export .tm0</button>
        </div>
        <div id="asm-errors"></div>
    </div>

    <div id="asm-example-row">
        <span id="or-text">example:</span>
        <button id="btn-asm-example" title="Load Thue-Morse assembly example">Thue-Morse (asm)</button>
        <button id="btn-ir-example" title="Load Thue-Morse IR example">Thue-Morse (IR)</button>
    </div>

    <div id="tab-ir" class="tab-content">
        <textarea id="ir-editor" spellcheck="false" placeholder="; High-level IR&#10;bit x&#10;x = 1&#10;print x"></textarea>
        <div id="ir-actions">
            <button id="btn-ir-compile">Compile &amp; Run</button>
            <button id="btn-ir-to-asm" title="Show generated assembly">Show ASM</button>
        </div>
        <div id="ir-errors"></div>
    </div>
</div>

<!-- Top Bar -->
<div id="top-bar" style="display:none">
    <button id="btn-step">Step</button>
    <button id="btn-play">Play</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-speed-down">-</button>
    <span id="speed-label">100ms</span>
    <button id="btn-speed-up">+</button>
    <button id="btn-view">Grid View</button>
    <button id="btn-load-new">Load New</button>
    <span id="state-info">State: 1 &nbsp; Steps: 0</span>
</div>

<!-- Main Area -->
<div id="main" style="display:none">
    <div id="trans-panel">
        <div class="line" id="tp-last"></div>
        <div class="line line-dim" id="tp-current"></div>
        <div class="line line-dim" id="tp-pos"></div>
    </div>
    <div id="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="trans-table-wrap">
            <div class="header">State  read1→next  read0→next</div>
            <div id="trans-table-body"></div>
        </div>
        <div id="history-scroll" style="display:none">
            <div id="history-scroll-thumb"></div>
        </div>
        <div id="legend">
            <span><span class="swatch" style="background:#3c4150"></span>0</span>
            <span><span class="swatch" style="background:#328cc8"></span>1</span>
            <span><span class="swatch" style="background:#ffc832"></span>head</span>
        </div>
    </div>
</div>

<script src="tm0.js"></script>
<script src="tm0asm.js"></script>
<script src="tm0ir.js"></script>
<script src="app.js"></script>
</body>
</html>
