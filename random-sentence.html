<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorless Green Ideas</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(1100px 700px at 70% -10%, #123 0%, #0c1420 55%, #060b12 100%);
    color: #e6edf3; font-family: Georgia, 'Times New Roman', serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: min(780px, 94vw);
    background: rgba(16, 26, 40, 0.8);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px; padding: 30px 34px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(6px);
    text-align: center;
  }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0.5px; font-weight: normal; color: #9ad0ff; }
  p.sub { margin: 0 0 26px; color: #7c8aa0; font-size: 13px; }
  p.sub i { color: #a5b8d0; }
  .quote {
    position: relative; min-height: 150px; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 18px clamp(14px, 5vw, 40px) 8px; margin: 4px 0 8px;
  }
  .quote::before {
    content: "\201C"; position: absolute; top: 0; left: 4px;
    font-size: clamp(48px, 12vw, 84px); line-height: 1;
    color: rgba(255,209,102,0.18); font-family: Georgia, serif;
  }
  .sentence {
    font-size: clamp(19px, 6vw, 28px); line-height: 1.5; font-style: italic; text-align: center;
    color: #f2f6fb; transition: opacity 0.15s; overflow-wrap: anywhere;
  }
  .sentence.fading { opacity: 0; }
  .attribution {
    margin-top: 14px; font-size: 13px; color: #8aa2c0; font-style: normal;
    letter-spacing: 0.4px;
  }
  .attribution::before { content: "— "; }
  .attribution b { color: #ffd166; font-weight: normal; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 8px 0 20px; }
  button {
    font-family: inherit; font-size: 15px; cursor: pointer; border: none; border-radius: 12px;
    padding: 10px 20px; color: #fff; background: #1d3557; transition: transform 0.1s, background 0.15s;
  }
  button:hover { transform: scale(1.05); }
  button.primary { background: #457b9d; }
  button.primary:hover { background: #a8dadc; color: #0b1724; }
  button.ghost { background: transparent; border: 1px solid #2e4566; color: #9ab3cc; }
  .parse {
    text-align: left; background: rgba(5, 10, 18, 0.6); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px; padding: 16px 20px; margin-top: 16px; display: none;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #8fd3a0;
    line-height: 1.6; white-space: pre; overflow-x: auto;
  }
  .tag {
    display: inline-block; font-family: ui-monospace, monospace; font-size: 11px;
    color: #ffd166; background: rgba(255,209,102,0.12); border-radius: 6px;
    padding: 2px 7px; margin-left: 6px; vertical-align: middle;
  }
  .favorites {
    margin-top: 18px; text-align: left; background: rgba(5, 10, 18, 0.5);
    border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px 16px;
  }
  .favhead {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #9ab3cc; text-transform: uppercase; letter-spacing: 1px;
  }
  .favhead button { font-size: 11px; padding: 4px 10px; background: #3a1d30; }
  #favList { list-style: none; margin: 10px 0 0; padding: 0; }
  #favList li {
    padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 14px; line-height: 1.5;
  }
  #favList li:last-child { border-bottom: none; }
  #favList .fauth { display: block; font-size: 11px; color: #7c8aa0; }
  #favList .fauth::before { content: "— "; }
  #favList .fdel {
    float: right; background: transparent; border: none; color: #666;
    font-size: 14px; padding: 0 4px; cursor: pointer;
  }
  #favList .fdel:hover { color: #ff6b6b; }
  #favList .fcopy {
    float: right; background: transparent; border: 1px solid #3a4a66; color: #9ab3cc;
    font-size: 11px; padding: 2px 9px; border-radius: 8px; margin-right: 8px; cursor: pointer;
  }
  #favList .fcopy:hover { border-color: #ffd166; color: #ffd166; }
  #favNote { margin-top: 10px; font-size: 12px; color: #7be07b; min-height: 16px; }
  .tagline {
    margin-top: 22px; font-size: 12px; color: #5f7390; text-align: center;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
    white-space: pre-line;
  }
  .sentence.thinking, .attribution.thinking { color: #8aa2c0; font-style: italic; }
  .sentence.thinking::after, .attribution.thinking::after {
    content: ""; display: inline-block; width: 1em; text-align: left;
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
    100% { content: ""; }
  }
  .rarity {
    margin-top: 6px; font-size: 12px; color: #6f84a0; font-style: normal;
    letter-spacing: 0.3px; font-variant-numeric: tabular-nums; display: none;
  }
  .stats {
    margin-top: 16px; text-align: left; background: rgba(5, 10, 18, 0.4);
    border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 10px 16px;
    display: none;
  }
  body.show-hidden-features .rarity,
  body.show-hidden-features .stats { display: block; }
  .stats summary {
    cursor: pointer; font-size: 12px; color: #9ab3cc;
    text-transform: uppercase; letter-spacing: 1px; user-select: none;
  }
  .stats table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; color: #c3d2e4; }
  .stats td { padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .stats td:last-child { text-align: right; color: #8fd3a0; font-variant-numeric: tabular-nums; }
  .stats table tr:last-child td { border-bottom: none; }
  html[data-theme="light"] body {
    background: radial-gradient(1100px 700px at 70% -10%, #ffffff 0%, #eef2f7 55%, #e2e8f0 100%);
    color: #1c2733;
  }
  html[data-theme="light"] .card {
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(15, 30, 50, 0.1);
    box-shadow: 0 20px 60px rgba(60, 80, 110, 0.25), inset 0 1px 0 rgba(255,255,255,0.8);
  }
  html[data-theme="light"] h1 { color: #2b5f8a; }
  html[data-theme="light"] p.sub { color: #64748b; }
  html[data-theme="light"] p.sub i { color: #3e5a75; }
  html[data-theme="light"] .quote::before { color: rgba(176, 128, 18, 0.22); }
  html[data-theme="light"] .sentence { color: #16212c; }
  html[data-theme="light"] .attribution { color: #5a6b7e; }
  html[data-theme="light"] .attribution b { color: #a0671a; }
  html[data-theme="light"] button { color: #1c2733; background: #e6ebf2; }
  html[data-theme="light"] button.primary { background: #457b9d; color: #fff; }
  html[data-theme="light"] button.primary:hover { background: #2f5d7a; color: #fff; }
  html[data-theme="light"] button.ghost { border-color: #c5cfda; color: #4a5a6e; }
  html[data-theme="light"] .parse {
    background: rgba(247, 250, 252, 0.92); color: #2f6f4f;
    border: 1px solid rgba(15, 30, 50, 0.1);
  }
  html[data-theme="light"] .tag { color: #a0671a; background: rgba(160, 103, 26, 0.12); }
  html[data-theme="light"] .favorites { background: rgba(247, 250, 252, 0.85); border: 1px solid rgba(15, 30, 50, 0.1); }
  html[data-theme="light"] .favhead { color: #5a6b7e; }
  html[data-theme="light"] .favhead button { background: #f1e3ee; }
  html[data-theme="light"] #favList li { border-bottom: 1px solid rgba(15, 30, 50, 0.08); }
  html[data-theme="light"] #favList .fauth { color: #6b7686; }
  html[data-theme="light"] #favList .fdel { color: #9aa3ad; }
  html[data-theme="light"] #favList .fdel:hover { color: #c0392b; }
  html[data-theme="light"] #favList .fcopy { border-color: #c5cfda; color: #4a5a6e; }
  html[data-theme="light"] #favList .fcopy:hover { border-color: #a0671a; color: #a0671a; }
  html[data-theme="light"] #favNote { color: #2f7d3f; }
  html[data-theme="light"] .tagline { color: #8b96a3; }
  html[data-theme="light"] .sentence.thinking, html[data-theme="light"] .attribution.thinking { color: #5a6b7e; }
  html[data-theme="light"] .rarity { color: #7a8a9c; }
  html[data-theme="light"] .stats { background: rgba(247, 250, 252, 0.8); border: 1px solid rgba(15, 30, 50, 0.1); }
  html[data-theme="light"] .stats summary { color: #4a5a6e; }
  html[data-theme="light"] .stats table { color: #33415a; }
  html[data-theme="light"] .stats td { border-bottom: 1px solid rgba(15, 30, 50, 0.07); }
  html[data-theme="light"] .stats td:last-child { color: #2f6f4f; }

<body>
<div class="card">
  <h1>Colorless Green Ideas</h1>
  <p class="sub">Syntactically perfect, Semantically meaningless.<br>
  After <i>Noam Chomsky</i>, 1957</p>

  <div class="quote">
    <div class="sentence" id="sentence">Colorless green ideas sleep furiously.</div>
    <div class="attribution" id="attribution"><b>Noam Chomsky</b>, <i>Syntactic Structures</i>, 1957</div>
    <div class="rarity" id="rarity"></div>
  </div>

  <div class="actions">
    <button class="primary" id="gen">✦ Generate</button>
    <button id="chomsky">Noam's Original</button>
    <button id="tree">Show parse tree</button>
    <button id="fav" title="Save this quote">♥ Save</button>
    <button id="copyCur" title="Copy current quote">⧉ Copy</button>
    <button id="theme" class="ghost" title="Toggle theme">☀ Light</button>
  </div>

  <div class="parse" id="parse"></div>

  <div class="favorites" id="favorites" style="display:none;">
    <div class="favhead">
      <span>♥ Favorites</span>
      <button id="clearFavs">Clear all</button>
    </div>
    <ul id="favList"></ul>
    <div id="favNote"></div>
  </div>

  <div class="tagline" id="tagline"></div>

  <details class="stats" id="statsBox">
    <summary>Session stats</summary>
    <div id="stats"></div>
  </details>
</div>
<script>
const sentenceEl = document.getElementById('sentence');
const attrEl = document.getElementById('attribution');
const parseEl = document.getElementById('parse');
const favBox = document.getElementById('favorites');
const favList = document.getElementById('favList');
const rarityEl = document.getElementById('rarity');

const stats = {
  total: 0, cond: 0, sub: 0, q: 0, wh: 0, disc: 0, mid: 0, exclaim: 0,
  compounds: 0, numbers: 0, conjoined: 0, relative: 0, tag: 0, favs: 0
};
function renderStats() {
  const el = document.getElementById('stats');
  if (!el) return;
  const rows = [
    ['Total generated', stats.total],
    ['Conditionals', stats.cond],
    ['Subordinate clauses', stats.sub],
    ['Two-clause compounds', stats.compounds],
    ['Questions', stats.q],
    ['Wh-questions', stats.wh],
    ['Discourse markers', stats.disc],
    ['Exclamations', stats.exclaim],
    ['Mid markers', stats.mid],
    ['Number words', stats.numbers],
    ['Conjoined subjects', stats.conjoined],
    ['Relative clauses', stats.relative],
    ['Tag questions', stats.tag],
    ['Favorites saved', stats.favs]
  ];
  el.innerHTML = '<table>' + rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') + '</table>';
}
function noteStats(s) {
  stats.total++;
  if (s.cond) stats.cond++;
  if (s.sub) stats.sub++;
  if (s.cond || s.sub) stats.compounds++;
  if (s.q) stats.q++;
  if (s.wh) stats.wh++;
  if (s.disc) {
    stats.disc++;
    if (EXCLAIM.includes(s.disc)) stats.exclaim++;
  }
  if (s.mid) stats.mid++;
  for (const c of [s.c1, s.c2]) {
    if (!c) continue;
    if (c.num) stats.numbers++;
    if (c.sub2) stats.conjoined++;
    if (c.rel) stats.relative++;
  }
  if (s.tag) stats.tag++;
  renderStats();
}

/* Max distinct sentences and quotes are astronomically large (A alone has
 * ~884.2k digits), so only their scientific-notation mantissa + exponent are
 * stored; see the count comment above powerAdjs() for the formula. Two-clause
 * sentences (conditionals + subordinate adverb clauses) dominate the union
 * and ~triple the clause exponent: conjoined subjects (×S) and relative
 * clauses (×R) each carry their own copy of the astronomical adj-sequence
 * count A, so two-clause sentences scale as (C·S·R)². The (1 + Q + T)
 * question/tag factor (3.3) and (1 + 0.3) discourse factor multiply the
 * total, while the (1 + 0.25) mid-marker factor applies to single clauses
 * only (a negligible tail of the union).
 */
const SENT_M = '1.15';
const SENT_E = 5305217;
const QUOTE_M = '5.54';
const QUOTE_E = 5305243;

/* Borges, The Library of Babel: 25 symbols × 1,312,000 chars/book.
 * Books = 25^1312000 ≈ 1.96 × 10^1834097; our sentence space leads by
 * VS_BABEL = 5,305,217 − 1,834,097 = 3,471,120 orders of magnitude. */
const BABEL_M = '1.96';
const BABEL_E = 1834097;
const VS_BABEL = 3471120;

/* Max distinct authors:
 *
 * Counts: GIVEN=30  SURNAMES=30  ADJ=275  NOUN=653  COLORS=133  SUFFIX=147  AUTHORS=34  ATTR=20
 * GIVEN initials: 26 distinct first letters.
 * SURNAMES initials: 25 distinct first letters.
 * M = 275 + 653 * (133 + 147) = 183115 possible adjectives (plain, or
 * "anynoun-color", or "anynoun-suffix").
 *
 * fakeAuthor() branches (pick is independent, so with replacement):
 *   Given + Surname              30 * 30                 = 900
 *   Given + initial (Ronald M.)  30 * 25                 = 750
 *   initials, 1 letter           26 * 30                 = 780
 *   initials, 2 letters          26 * 26 * 30            = 20280
 *   titled (50 titles)            50 * 30                 = 1500
 *     + "of <noun>"              50 * 30 * 653            = 979500
 *   <noun> of the <noun>         653 * 653               = 426409
 *   <adj> <noun>                 M * 653                 = 119574095
 *   <adj> <adj> <noun>           M * M * 653             = 21895810405925
 * Fixed pools:
 *   AUTHORS                                              = 34
 *   ATTR authors (pair [0])                              = 20
 *
 * TOTAL = 900 + 750 + 780 + 20280 + (1500 + 979500) + 426409 + 119574095 + 21895810405925 + 34 + 20
 *       = 21895931410193
 */
const TOTAL_AUTHORS = 21895931410193;

/* Max distinct attributions (author + source pairs):
 *
 * fakeSource() sources (base):
 *   SOURCES static                                         = 32
 *   SOURCES dynamic (circa BC:1000, century:8, time:288,
 *     postmarked:2100, email-time:288)                     = 3684
 *   On the <adj> <noun> of <noun>    M * 653 * 653         = 78081884035
 *   The <adj> <noun> Revisited       M * 653               = 119574095
 *   Journal of <adj> <noun>          M * 653               = 119574095
 *   datePhrase():
 *     circa / c., AD or BC           2100 + 1000 + 2100 + 1000 = 6200
 *     in the <century>               1200s..1900s           = 8
 *     dates                          28 * 12 * 2100 * 291   = 205329600
 *       (291 = 3 formats + 1 format with a time; time:288)
 *     time                                                = 288
 *     subtotal                                            = 205336096
 *   union(SOURCES, datePhrase)  = 32 + 3684 + 205336096 - 1296 (shared circa BC,
 *     century, time)                                      = 205338516
 *   TOTAL base fakeSource     = 205338516 + 78081884035 + 119574095 + 119574095
 *                             = 78526370741
 *   Optional region suffix: 5 prepositions * 56 REGIONS = 280 variants,
 *     applied with REGION_PROB=0.35 -> each base source x (1 + 280) = x281
 *   TOTAL fakeSource          = 78526370741 * 281            = 22065910178221
 *
 * Attribution branches:
 *   generated author * source  21895931410139 * 22065910178221  = 483153655764615053336382719
 *   AUTHORS * source           34 * 22065910178221             = 750240946059514
 *   ATTR verbatim pairs        17 static + 1000 + 8 + 288      = 1313
 *   TOTAL_ATTRIBUTIONS                                        = 483153655765365294282443546
 */
const TOTAL_ATTRIBUTIONS = 483153655765365294282443546n;

const FAV_KEY = 'cgi-favorites';
let favorites = [];
try { favorites = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch (e) { favorites = []; }

function currentQuote() {
  return {
    text: sentenceEl.textContent,
    attr: attrEl.textContent
  };
}

function quoteString(q) {
  return `“${q.text}” — ${q.attr}`;
}

let copyNoteTimer = null;
function flashNote(msg) {
  const note = document.getElementById('favNote');
  note.textContent = msg;
  clearTimeout(copyNoteTimer);
  copyNoteTimer = setTimeout(() => { note.textContent = ''; }, 1500);
}

function copyText(str) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(str);
  }
  const ta = document.createElement('textarea');
  ta.value = str;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
  return Promise.resolve();
}

document.getElementById('copyCur').addEventListener('click', () => {
  copyText(quoteString(currentQuote())).then(() => flashNote('✓ Copied current quote'));
});

function renderFavorites() {
  favList.innerHTML = '';
  favorites.forEach((q, i) => {
    const li = document.createElement('li');
    const del = document.createElement('button');
    del.className = 'fdel';
    del.textContent = '✕';
    del.title = 'Remove';
    del.addEventListener('click', () => {
      favorites.splice(i, 1);
      localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
      renderFavorites();
    });
    const cpy = document.createElement('button');
    cpy.className = 'fcopy';
    cpy.textContent = '⧉';
    cpy.title = 'Copy quote';
    cpy.addEventListener('click', () => {
      copyText(quoteString(q)).then(() => flashNote('✓ Copied favorite'));
    });
    const qtext = document.createElement('span');
    qtext.textContent = '“' + q.text + '”';
    const qattr = document.createElement('span');
    qattr.className = 'fauth';
    qattr.textContent = q.attr;
    li.appendChild(del);
    li.appendChild(cpy);
    li.appendChild(qtext);
    li.appendChild(qattr);
    favList.appendChild(li);
  });
  favBox.style.display = favorites.length ? 'block' : 'none';
}

document.getElementById('fav').addEventListener('click', () => {
  const q = currentQuote();
  if (!q.text || q.text === '—') return;
  favorites.push(q);
  stats.favs++;
  renderStats();
  localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
  renderFavorites();
});
document.getElementById('clearFavs').addEventListener('click', () => {
  if (!favorites.length) return;
  if (confirm('Remove all saved favorites?')) {
    favorites = [];
    localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
    renderFavorites();
  }
});

renderFavorites();

function randomAttribution() {
  const r = Math.random();
  let name, source;
  if (r < 0.30) {
    name = fakeAuthor();
    source = fakeSource();
  } else if (r < 0.85) {
    name = pick(AUTHORS);
    source = fakeSource();
  } else {
    [name, source] = pick(ATTR);
    if (typeof source === 'function') source = source();
  }
  attrEl.innerHTML = `<b>${name}</b>, <i>${source}</i>`;
}

const DET = ['the', 'some', 'my', 'our', 'no', 'these', 'those', 'all', 'many', 'several', 'few', 'two', 'three', 'most', 'countless', 'several', 'innumerable', 'every', 'each', 'whose', 'certain'];
const ADJ = [

  'white', 'black', 'grey', 'gray', 'silver', 'gold', 'platinum', 'bronze', 'copper', 'brass',

 * Vocab counts: DET=21  ADJ=275  NOUN=653  VERB=3070  ADV=647  TRANS=88
 *              AUX=11  FREQ=12  NEG=2  COLORS=133  SUFFIX=147

 * Each adjective slot holds either a plain adjective (ADJ=275), a compound
 * "anynoun-color" (653 * 133 = 86849), or a compound "anynoun-suffix"
 * (653 * 147 = 95991), so M = 275 + 86849 + 95991 = 183115 possible
 * adjectives. Every compound is hyphenated with a unique noun-color or
 * noun-suffix pair (suffix list is disjoint from the color list), so no two
 * slots can collide on the same string.

 * Ordered no-repeat adjective sequences (k adjectives, k = 1..M):
 *   A = sum_{k=1..M} P(M,k) = floor(e * M!) - 1     (~884.2k digits, so it is
 *   not stored as a literal; only sciNote mantissa + exponent are kept below)

 *   - aux + negation (AUX * NEG): 11 * 2

 *   X = 1 + 12 + 11 + 132 + 22 = 178

 * sentence() patterns:

 *   single-clause TOTAL ~ 2.23 * 10^1177835   (tail of the union)

  if (q) {
    const fst = [];
    if (wh) fst.push({ w: wh, pos: 'wh' });
    if (s.aux) fst.push({ w: s.aux, pos: 'aux' }); else fst.push({ w: s.sg ? 'does' : 'do', pos: 'aux' });
    parts = [...fst, ...np];
    npStart = fst.length;
    if (s.neg) parts.push({ w: s.neg, pos: 'neg' });
    parts.push({ w: s.verb, pos: 'verb' });
    if (s.object && wh !== 'what') parts.push({ w: s.obj, pos: 'obj' });
    if (s.adv) parts.push({ w: s.adv, pos: 'adv' });
  } else {
    parts = [...np];
    if (s.aux) parts.push({ w: s.aux, pos: 'aux' });
    if (s.neg) parts.push({ w: s.neg, pos: 'neg' });
    parts.push({ w: s.sg && !s.aux ? thirdSingular(s.verb) : s.verb, pos: 'verb' });
    if (s.object) parts.push({ w: s.obj, pos: 'obj' });
    if (s.adv) parts.push({ w: s.adv, pos: 'adv' });
  }
  if (mid) {
    parts.splice(npStart + np.length, 0, { w: ', ' + mid + ',', pos: 'mid' });
  }
  return parts;
}

function sentenceParts(s) {
  let parts;
  if (s.cond || s.sub) {
    const main = clauseParts(s.c2, { question: s.q, wh: s.wh, mid: null });
    const ifc = clauseParts(s.c1, { question: false, wh: null, mid: null });
    if (s.invert) {
      const np = [];
      if (s.c1.det) np.push({ w: s.c1.det, pos: 'det' });
      if (s.c1.num) np.push({ w: s.c1.num, pos: 'num' });
      for (const a of s.c1.adjs) np.push({ w: a, pos: 'adj' });
      np.push({ w: s.c1.noun, pos: 'noun' });
      const vp = [];
      vp.push({ w: s.c1.verb, pos: 'verb' });
      if (s.c1.object) vp.push({ w: s.c1.obj, pos: 'obj' });
      if (s.c1.adv) vp.push({ w: s.c1.adv, pos: 'adv' });
      parts = [{ w: 'were', pos: 'aux' }, ...np, { w: 'to', pos: 'func' }, ...vp, { w: ',', pos: 'punct' }, ...main];
    } else if (s.order === 'front') {
      parts = [{ w: s.conj, pos: 'conj' }, ...ifc, { w: ',', pos: 'punct' }, ...main];
    } else {
      parts = [...main, { w: s.conj, pos: 'conj' }, ...ifc];
    }
  } else {
    parts = clauseParts(s.c1, { question: s.q, wh: s.wh, mid: s.mid });
  }
  if (s.disc) parts = [{ w: s.disc, pos: 'disc' }, { w: ',', pos: 'punct' }, ...parts];
  if (s.tag) {
    parts.push({ w: ',', pos: 'punct' }, { w: tagPhrase(s.tag), pos: 'tag' });
  }
  return parts;
}

function joinParts(parts) {
  let str = '';
  for (const p of parts) {
    if (p.w.startsWith(',')) str += p.w;
    else str += (str ? ' ' : '') + p.w;
  }
  return str;
}

function capFirst(parts) {
  if (parts.length && parts[0].w) {
    parts[0].w = parts[0].w.charAt(0).toUpperCase() + parts[0].w.slice(1);
  }
}

function words(s) {
  const parts = sentenceParts(s);
  capFirst(parts);
  return joinParts(parts) + (s.q || s.tag ? '?' : (maybe(0.1) ? '!' : '.'));
}

function npNode(c) {
  const np = { label: 'NP', children: [] };
  if (c.det) np.children.push({ label: 'Det', text: c.det });
  if (c.num) np.children.push({ label: 'Num', text: c.num });
  for (const a of c.adjs) np.children.push({ label: 'Adj', text: a });
  np.children.push({ label: 'N', text: c.noun });
  if (c.rel) {
    np.children.push({ label: 'Rel', text: 'that' });
    if (c.rel.kind === 'subj') {
      np.children.push({ label: 'V', text: c.sg ? thirdSingular(c.rel.verb) : c.rel.verb });
      if (c.rel.adv) np.children.push({ label: 'Adv', text: c.rel.adv });
    } else {
      const rn = npNode(c.rel.np);
      for (const ch of rn.children) np.children.push(ch);
      np.children.push({ label: 'V', text: c.rel.verb });
    }
  }
  return np;
}

function clauseSubtree(c) {
  const np = c.sub2
    ? { label: 'NP', children: [npNode(c), { label: 'Conj', text: 'and' }, npNode(c.sub2)] }
    : npNode(c);
  const vp = { label: 'VP', children: [] };
  if (c.aux) vp.children.push({ label: 'Aux', text: c.aux });
  if (c.neg) vp.children.push({ label: 'Neg', text: c.neg });
  vp.children.push({ label: 'V', text: (c.sg && !c.aux) ? thirdSingular(c.verb) : c.verb });
  if (c.object) vp.children.push({ label: 'N', text: c.obj });
  if (c.adv) vp.children.push({ label: 'Adv', text: c.adv });
  return { np, vp };
}

function parseTree(s) {
  const root = { label: s.q ? 'S (Q)' : 'S', children: [] };
  if (s.wh) root.children.push({ label: 'Wh', text: s.wh });
  if (s.disc) root.children.push({ label: 'Disc', text: s.disc });
  if (s.cond || s.sub) {
    const conjNode = { label: 'Conj', text: s.invert ? 'were to' : s.conj, children: [] };
    const c1 = clauseSubtree(s.c1);
    conjNode.children.push(c1.np, c1.vp);
    root.children.push(conjNode);
  }
  const c2 = clauseSubtree(s.cond || s.sub ? s.c2 : s.c1);
  root.children.push(c2.np, c2.vp);
  if (s.tag) root.children.push({ label: 'Tag', text: tagPhrase(s.tag) + '?' });
  const lines = [];
  const draw = (n, prefix, isLast) => {
    lines.push(prefix + (isLast ? '└─ ' : '├─ ') + (n.text ? n.label + '  "' + n.text + '"' : n.label));
    const cont = isLast ? '    ' : '│   ';
    (n.children || []).forEach((ch, i) => draw(ch, prefix + cont, i === n.children.length - 1));
  };
  lines.push(root.label);
  root.children.forEach((ch, i) => draw(ch, '', i === root.children.length - 1));
  return lines.join('\n');
}

function familyExponent(s) {
  const lg = Math.log10;
  const falling = (n, k) => { let x = 0; for (let i = 0; i < k; i++) x += lg(n - i); return x; };
  const clauseX = (c) => {
    let x = falling(ADJ_TOTAL, c.adjs.length);
    x += lg((c.object ? TRANS : VERB).length);
    if (c.adv) x += lg(ADV.length);
    if (c.det) x += lg(DET.length);
    if (c.num) x += 100;
    if (c.aux) x += lg(AUX.length);
    if (c.neg) x += lg(c.neg === 'not' || c.neg === 'ever' ? NEG.length : FREQ.length);
    if (c.sub2) x += lg(DET.length + 1) + falling(ADJ_TOTAL, c.sub2.adjs.length) + lg(NOUN.length);
    if (c.rel) {
      if (c.rel.kind === 'subj') x += lg(VERB.length) + lg(1 + ADV.length);
      else x += lg(DET.length + 1) + falling(ADJ_TOTAL, c.rel.np.adjs.length) + lg(NOUN.length) + lg(TRANS.length);
    }
    return x;
  };
  let x;
  if (s.cond || s.sub) {
    x = clauseX(s.c1) + clauseX(s.c2) + lg((s.cond ? CONJ : SUB_CONJ).length);
  } else {
    x = clauseX(s.c1);
  }
  if (s.disc) x += lg(DISCOURSE.length + EXCLAIM.length);
  if (s.mid) x += lg(MID_DISCOURSE.length);
  if (s.wh) x += lg(5);
  return x;
}

function generate() {
  const s = sentence();
  const genBtn = document.getElementById('gen');
  const text = words(s);
  noteStats(s);
  sentenceEl.textContent = pickWeighted(THINK_VERBS);
  sentenceEl.classList.add('thinking');
  attrEl.textContent = pickWeighted(ATTR_VERBS);
  attrEl.classList.add('thinking');
  genBtn.disabled = true;
  const delay = Math.min(300 + text.split(' ').length * 60 + Math.random() * 200, 4000);
  setTimeout(() => {
    sentenceEl.textContent = text;
    sentenceEl.classList.remove('thinking');
    attrEl.classList.remove('thinking');
    genBtn.disabled = false;
    randomAttribution();
    rarityEl.textContent = '~1 in 10^' + familyExponent(s).toLocaleString('en-US', { maximumFractionDigits: 1 }) + ' of its family';
    parseEl.dataset.tree = parseTree(s);
    if (parseEl.style.display !== 'none') parseEl.textContent = parseEl.dataset.tree;
  }, delay);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme').textContent = theme === 'light' ? '☾ Dark' : '☀ Light';
}
applyTheme(localStorage.getItem('cgi-theme') === 'light' ? 'light' : 'dark');
document.getElementById('theme').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  localStorage.setItem('cgi-theme', next);
  applyTheme(next);
});
let hiddenArmed = false, hiddenTimer = null;
const HIDDEN_DOUBLE_MS = 700;
document.addEventListener('keydown', (e) => {
  if (e.code === 'Enter' && e.ctrlKey && e.shiftKey && !e.repeat) {
    e.preventDefault();
    if (hiddenArmed) {
      hiddenArmed = false;
      clearTimeout(hiddenTimer);
      document.body.classList.toggle('show-hidden-features');
    } else {
      hiddenArmed = true;
      hiddenTimer = setTimeout(() => { hiddenArmed = false; }, HIDDEN_DOUBLE_MS);
    }
    return;
  }
  if (e.code !== 'Space' || e.repeat) return;
  const t = e.target;
  if (t && (t.tagName === 'BUTTON' || t.tagName === 'A' || t.tagName === 'SUMMARY' ||
            t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  e.preventDefault();
  generate();
});

document.getElementById('gen').addEventListener('click', generate);
document.getElementById('chomsky').addEventListener('click', () => {
  sentenceEl.textContent = 'Colorless green ideas sleep furiously.';
  attrEl.innerHTML = '<b>Noam Chomsky</b>, <i>Syntactic Structures</i>, 1957';
  rarityEl.textContent = '';
  parseEl.dataset.tree =
    'S\n├─ NP\n│   ├─ Adj  "colorless"\n│   ├─ Adj  "green"\n│   └─ N    "ideas"\n└─ VP\n    ├─ V    "sleep"\n    └─ Adv  "furiously"';
  if (parseEl.style.display !== 'none') parseEl.textContent = parseEl.dataset.tree;
});
document.getElementById('tree').addEventListener('click', () => {
  if (parseEl.style.display === 'none') {
    parseEl.style.display = 'block';
    parseEl.textContent = parseEl.dataset.tree || '';
  } else {
    parseEl.style.display = 'none';
  }
});

generate();

document.getElementById('tagline').textContent =
  'offering ' + sciM(QUOTE_M, QUOTE_E, CDOT) +
  ' quotes from ' + sciM(SENT_M, SENT_E, CDOT) +
  ' sentences and ' + sciNote(TOTAL_ATTRIBUTIONS, CDOT) +
  ' attributions by ' + sciNote(TOTAL_AUTHORS, CDOT) +
  ' possible authors.\n' +
  'Outnumbering the Library of Babel\'s ~' + sciM(BABEL_M, BABEL_E, CDOT) +
  ' books by ' + VS_BABEL.toLocaleString('en-US') + ' orders of magnitude.';
</script>
