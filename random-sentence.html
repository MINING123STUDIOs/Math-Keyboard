  .quote::before {

  .attribution {
    margin-top: 14px; font-size: 13px; color: #8aa2c0; font-style: normal;
    letter-spacing: 0.4px;
  }
  .attribution::before { content: "— "; }
  .attribution b { color: #ffd166; font-weight: normal; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 8px 0 20px; }
  button {

  button.primary { background: #457b9d; }

const FAV_KEY = 'cgi-favorites';

try { favorites = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch (e) { favorites = []; }

function currentQuote() {
  return {
    text: sentenceEl.textContent,
    attr: attrEl.textContent
  };
}

function quoteString(q) {
  return `“${q.text}” — ${q.attr}`;
}

let copyNoteTimer = null;
function flashNote(msg) {
  const note = document.getElementById('favNote');
  note.textContent = msg;
  clearTimeout(copyNoteTimer);
  copyNoteTimer = setTimeout(() => { note.textContent = ''; }, 1500);
}

function copyText(str) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(str);
  }
  const ta = document.createElement('textarea');
  ta.value = str;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
  return Promise.resolve();
}

document.getElementById('copyCur').addEventListener('click', () => {
  copyText(quoteString(currentQuote())).then(() => flashNote('✓ Copied current quote'));
});

function renderFavorites() {
  favList.innerHTML = '';
  favorites.forEach((q, i) => {
    const li = document.createElement('li');
    const del = document.createElement('button');
    del.className = 'fdel';
    del.textContent = '✕';
    del.title = 'Remove';
    del.addEventListener('click', () => {
      favorites.splice(i, 1);
      localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
      renderFavorites();
    });
    const cpy = document.createElement('button');
    cpy.className = 'fcopy';
    cpy.textContent = '⧉';
    cpy.title = 'Copy quote';
    cpy.addEventListener('click', () => {
      copyText(quoteString(q)).then(() => flashNote('✓ Copied favorite'));
    });
    const qtext = document.createElement('span');
    qtext.textContent = '“' + q.text + '”';
    const qattr = document.createElement('span');
    qattr.className = 'fauth';
    qattr.textContent = q.attr;
    li.appendChild(del);
    li.appendChild(cpy);
    li.appendChild(qtext);
    li.appendChild(qattr);
    favList.appendChild(li);
  });
  favBox.style.display = favorites.length ? 'block' : 'none';
}

document.getElementById('fav').addEventListener('click', () => {
  const q = currentQuote();
  if (!q.text || q.text === '—') return;
  favorites.push(q);
  localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
  renderFavorites();
});
document.getElementById('clearFavs').addEventListener('click', () => {
  if (!favorites.length) return;
  if (confirm('Remove all saved favorites?')) {
    favorites = [];
    localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
    renderFavorites();
  }
});

renderFavorites();

function randomAttribution() {
  const [who, where] = pick(ATTR);
  if (Math.random() < 0.65) {
    const r = Math.random();
    let name;
    if (r < 0.45) {
      name = `${pick(ADJ)} ${pick(NOUN)}`;
    } else if (r < 0.8) {
      name = `${pick(ADJ)} ${pick(ADJ)} ${pick(NOUN)}`;
    } else {
      name = `${pick(NOUN)} of the ${pick(NOUN)}`;
    }
    attrEl.innerHTML = `<b>${name}</b>, <i>${where}</i>`;
  } else {
    attrEl.innerHTML = `<b>${who}</b>, <i>${where}</i>`;
  }
}

  'unpleasantly', 'unquestionably', 'unrealistically', 'unreasonably', 'unreliably', 'unreservedly',

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const maybe = (p) => Math.random() < p;
const NUM_PROB = 0.3;
const GOOGOL = 100;

const ONES = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
  'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
const GROUP = ['', 'thousand', 'million', 'billion', 'trillion', 'quadrillion', 'quintillion',
  'sextillion', 'septillion', 'octillion', 'nonillion', 'decillion', 'undecillion', 'duodecillion',
  'tredecillion', 'quattuordecillion', 'quindecillion', 'sexdecillion', 'septendecillion',
  'octodecillion', 'novemdecillion', 'vigintillion', 'unvigintillion', 'duovigintillion',
  'tresvigintillion', 'quattuorvigintillion', 'quinvigintillion', 'sexvigintillion',
  'septenvigintillion', 'octovigintillion', 'novemvigintillion', 'trigintillion',
  'untrigintillion', 'duotrigintillion'];

function below100(n) {
  if (n < 20) return ONES[n];
  const o = n % 10;
  return TENS[Math.floor(n / 10)] + (o ? '-' + ONES[o] : '');
}

function below1000(n) {
  const h = Math.floor(n / 100);
  const r = n % 100;
  return (h ? ONES[h] + ' hundred' + (r ? ' ' : '') : '') + (r ? below100(r) : '');
}

function numberToWords(n) {
  if (n === 0n) return 'zero';
  const parts = [];
  let g = 0;
  while (n > 0n) {
    const chunk = Number(n % 1000n);
    if (chunk) parts.push(below1000(chunk) + (GROUP[g] ? ' ' + GROUP[g] : ''));
    n /= 1000n;
    g++;
  }
  return parts.reverse().join(' ');
}

const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const CDOT = '·';

function sciNote(v, sep) {
  if (v === 0n) return '0';
  const d = v.toString();
  const e = d.length - 1;
  if (e === 0) return d;
  let m = d.slice(0, 3);
  m = m.length > 1 ? m[0] + '.' + m.slice(1) : m;
  m = m.replace(/\.?0+$/, '');
  return m + ' ' + sep + ' 10' + String(e).replace(/[0-9]/g, (x) => SUP[x]);
}

function bigRand(span) {
  const bytes = Math.ceil(span.toString(2).length / 8);
  const buf = new Uint8Array(bytes);
  crypto.getRandomValues(buf);
  let out = 0n;
  for (let i = 0; i < bytes; i++) out = (out << 8n) | BigInt(buf[i]);
  return out % span;
}

function randomGoogol() {
  if (Math.random() < 0.02) return 0n;
  let k = 0;
  while (k < GOOGOL && Math.random() < 2 / 3) k++;
  if (k >= GOOGOL) return 10n ** BigInt(GOOGOL);
  const lo = 10n ** BigInt(k);
  const hi = 10n ** BigInt(k + 1);
  return lo + bigRand(hi - lo);
}

const ADJ_PROB = 1 / 2;

/* Max distinct sentences (finite, because adjectives cannot repeat):
 *
 * Vocab counts: DET=21  ADJ=159  NOUN=653  VERB=3070  ADV=647  TRANS=88
 *
 * Ordered no-repeat adjective sequences (k adjectives, k = 1..159):
 *   A = sum_{k=1..159} P(159,k)
 *     = 8009967241202236541314455661485852633569267137213189171242661895778361761188886402659606409421346810892881271097970417808496146706069693622552616635101017066299147950365762985871067688497812295729463502687975046904563762198565836010062442551708934244614479812409923161780491985511259
 *
 * Optional adverb factor is (1 + ADV) since both variants are valid sentences.
 * Optional number factor is (1 + (10^100+1)): either no number, or one of
 * 10^100+1 values (0 .. a googol). It always precedes the adjectives, so
 * exactly 1 position (front for det-less patterns, after-det otherwise).
 * sentence() patterns:
 *   0: A * N * V * (1+W)          (no det)
 *   1: A * D * N * V * (1+W)
 *   2: A * N * V * (1+W)          (no det)
 *   3: A * D * N * V * W          (adverb required)
 *   4: A * N * V * W              (adverb required)
 *   5: A * N * T * N * (1+W)      (transitive verb + object noun)
 *
 * TOTAL = ( A*N*V*(1+W)*(2+D) + A*N*V*W*(1+D) + A*N*N*T*(1+W) ) * (1 + (10^100+1))
 *       = 6626548721403641335447640480118582510928270134924792045469501103553612626115544506902899860062936861820626794988782982321469288806056275813825990173930358801906416786145221185868860572046172561845672973156778747294300598811366529110414276839465904060100887717392281166595997924205314961925471491660174818673721136671510484625594528491910241014653253142189223230613216411361074442695333737072328
 */
function powerAdjs() {
  const used = new Set();
  const adjs = [];
  let a = pick(ADJ);
  used.add(a);
  adjs.push(a);
  while (Math.random() < ADJ_PROB && used.size < ADJ.length) {
    let b = pick(ADJ);
    while (used.has(b)) b = pick(ADJ);
    used.add(b);
    adjs.push(b);
  }
  return adjs;
}
const ATTR = [
  ['an ancient proverb', 'of unknown origin'],
  ['an unnamed oracle', 'on a hill somewhere'],
  ['the collective unconscious', 'probably'],
  ['a forgotten philosopher', 'circa 400 BC'],
  ['some guy', 'in the 1600s'],
  ['your subconscious', 'while you slept'],
  ['a minor prophet', 'witness protection program'],
  ['a slightly annoyed librarian', 'muttering to themselves'],
  ['a committee', 'of imaginary experts'],
  ['an enthusiastic parrot', 'repeating itself'],
  ['a sleep-deprived linguist', '3 AM'],
  ['the ghost of a grammarian', 'unfinished business'],
  ['a fortune cookie', 'slightly damaged'],
  ['an emoji', 'deep in thought']
];

function sentence() {
  const s = { det: null, adjs: [], noun: null, verb: null, adv: null, object: false, num: null, numPos: null };

  if (maybe(NUM_PROB)) {
    s.num = numberToWords(randomGoogol());
  }

  const pattern = Math.floor(Math.random() * 6);
  if (pattern === 0) {
    // Chomsky canonical-ish: Adj* N V Adv
    s.adjs = powerAdjs();
    s.noun = pick(NOUN);
    s.verb = pick(VERB);
    s.adv = maybe(0.7) ? pick(ADV) : null;
  } else if (pattern === 1) {
    s.det = pick(DET);
    s.adjs = powerAdjs();
    s.noun = pick(NOUN);
    s.verb = pick(VERB);
    s.adv = maybe(0.7) ? pick(ADV) : null;
  } else if (pattern === 2) {
    s.adjs = powerAdjs();
    s.noun = pick(NOUN);
    s.verb = pick(VERB);
    s.adv = maybe(0.8) ? pick(ADV) : null;
  } else if (pattern === 3) {
    s.det = pick(DET);
    s.adjs = powerAdjs();
    s.noun = pick(NOUN);
    s.verb = pick(VERB);
    s.adv = pick(ADV);
  } else if (pattern === 4) {
    s.adjs = powerAdjs();
    s.noun = pick(NOUN);
    s.verb = pick(VERB);
    s.adv = pick(ADV);
  } else {
    s.adjs = powerAdjs();
    s.noun = pick(NOUN);
    s.verb = pick(TRANS);
    s.adv = maybe(0.6) ? pick(ADV) : null;
    s.object = true;
    s.obj = pick(NOUN);
  }
  if (s.num) {
    if (s.det) s.numPos = 'after-det';
    else s.numPos = 'front';
  }
  return s;
}

function words(s) {
  const np = [];
  if (s.det) np.push(s.det);
  if (s.num) np.push(s.num);
  np.push(...s.adjs);
  np.push(s.noun);
  const parts = [...np, s.verb];
  if (s.object) parts.push(s.obj);
  if (s.adv) parts.push(s.adv);
  let str = parts.join(' ');
  str = str.charAt(0).toUpperCase() + str.slice(1) + '.';
  return str;
}

function parseTree(s) {
  const lines = [];
  lines.push('S');
  lines.push('├─ NP');
  const npChildren = [];
  if (s.det) npChildren.push(['Det', s.det]);
  if (s.num) npChildren.push(['Num', s.num]);
  for (const a of s.adjs) npChildren.push(['Adj', a]);
  npChildren.push(['N', s.noun]);
  npChildren.forEach((c, i) => {
    lines.push((i === npChildren.length - 1 ? '│   └─ ' : '│   ├─ ') + c[0] + '  "' + c[1] + '"');
  });
  lines.push('└─ VP');
  const vpChildren = [['V', s.verb]];
  if (s.object) vpChildren.push(['N', s.obj]);
  if (s.adv) vpChildren.push(['Adv', s.adv]);
  vpChildren.forEach((c, i) => {
    lines.push((i === vpChildren.length - 1 ? '    └─ ' : '    ├─ ') + c[0] + '  "' + c[1] + '"');
  });
  return lines.join('\n');
}

function generate() {
  const s = sentence();
  const genBtn = document.getElementById('gen');
  sentenceEl.textContent = 'Thinking';
  sentenceEl.classList.add('thinking');
  genBtn.disabled = true;
  setTimeout(() => {
    sentenceEl.textContent = words(s);
    sentenceEl.classList.remove('thinking');
    genBtn.disabled = false;
    randomAttribution();
    parseEl.dataset.tree = parseTree(s);
    if (parseEl.style.display !== 'none') parseEl.textContent = parseEl.dataset.tree;
  }, 350 + Math.random() * 450);
}
