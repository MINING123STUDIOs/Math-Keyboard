6} #playBtn{background:#2d3561;margin-top:16px} #playBtn:hover{background:#3b4a7a} #result{margin-top:16px;font-size:18px;text-align:center;min-height:24px} #best{color:#2ecc71} #notBest{color:#e74c3c} #stats{margin-top:20px;font-size:13px;color:#888;text-align:center} button:disabled{opacity:.4;cursor:default}</style><div id="info">Envelope <b id="count">1</b> of <b id="total">20</b> · Best so far: $<b id="bestSoFar">0</b></div><div class="envelope hidden" id="card"></div><div id="buttons"><button id="stopBtn">STOP</button> <button id="contBtn">CONTINUE</button> </div><div id="result"></div><button id="playBtn" style="display:none">Play Again</button> <div id="stats"></div><script>var values,idx,best,picked,round,wins,N=20;function powerLaw(){return Math.floor(1/Math.pow(Math.random(),1.5))}function fmt(e){return e.toLocaleString()}function newRound(){var e={};for(values=[];values.length<N;){var t=powerLaw();e[t]||(e[t]=1,values.push(t))}idx=0,best=0,picked=null,round++,document.getElementById("count").textContent="1",document.getElementById("total").textContent=N,document.getElementById("bestSoFar").textContent=fmt(0);var n=document.getElementById("card");n.className="envelope hidden",n.textContent="",document.getElementById("result").textContent="",document.getElementById("playBtn").style.display="none",document.getElementById("stopBtn").disabled=!1,document.getElementById("contBtn").disabled=!1,reveal()}function reveal(){var e=values[idx];e>best&&(best=e);var t=document.getElementById("card");t.className="envelope revealed",t.textContent="$"+fmt(e),document.getElementById("bestSoFar").textContent=fmt(best),document.getElementById("count").textContent=idx+1}function stop(){picked=values[idx];var e=document.getElementById("card"),t=picked===Math.max.apply(null,values);e.className="envelope revealed "+(t?"won":"lost");var n=document.getElementById("result");t?(n.innerHTML='<span id="best">You picked the best envelope! $'+fmt(picked)+"</span>",wins++):n.innerHTML='<span id="notBest">You picked $'+fmt(picked)+" — best was $"+fmt(Math.max.apply(null,values))+"</span>",endRound()}function cont(){if(++idx>=N-1)return reveal(),void stop();reveal()}function endRound(){document.getElementById("stopBtn").disabled=!0,document.getElementById("contBtn").disabled=!0,document.getElementById("playBtn").style.display="",document.getElementById("stats").textContent="Round "+round+" · "+wins+" wins ("+(round>0?Math.round(wins/round*100):0)+"%)"}document.getElementById("stopBtn").addEventListener("click",stop),document.getElementById("contBtn").addEventListener("click",cont),document.getElementById("playBtn").addEventListener("click",(function(){newRound()})),round=0,wins=0,newRound();</script> <!-- build 🦄🤨😢🙄😮🐞😓😀💐♉🧀🍓😏🥔😯😩🌗✋👊🐸🥚🦅🤳🤐🍎💕🌘🌍🙃🌞😵🦀 -->
