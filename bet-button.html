r bal=100,betEl=document.getElementById("bet"),balEl=document.getElementById("balance"),resEl=document.getElementById("result");function update(){balEl.textContent=bal,balEl.style.color=bal>0?"#2ecc71":"#e74c3c"}function play(){var e=parseInt(betEl.value,10);if(isNaN(e)||e<1)resEl.textContent="Enter a valid bet.";else if(e>bal)resEl.textContent="Not enough balance!";else{var t=Math.random();t<2/9?(bal-=e,resEl.innerHTML='<span style="color:#e74c3c">Lost $'+e+"!</span>"):t<74/81?resEl.innerHTML='<span style="color:#999">Push — bet returned.</span>':(bal+=8*e,resEl.innerHTML='<span style="color:#2ecc71">Won $'+9*e+"!</span>"),update(),bal<=0&&(resEl.innerHTML='<span style="color:#e74c3c">Game over!</span>',betEl.disabled=!0,document.getElementById("playBtn").disabled=!0)}}function reset(){bal=100,betEl.value=10,betEl.disabled=!1,document.getElementById("playBtn").disabled=!1,resEl.textContent="",update()}document.getElementById("playBtn").addEventListener("click",play),document.getElementById("resetBtn").addEventListener("click",reset),betEl.addEventListener("keydown",(function(e){"Enter"===e.key&&play()})),update();</script> <!-- build 😯😞🦉🤤😯😴🍀🥕🌙🌼😒🐛🥝🥀🦆💅🌞🍉🐣🐸😟😀🎄🌏🥥💜😊😜😏🦖🥞🌗 -->
