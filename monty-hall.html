losses;for(var o=0;o<3;o++){var d=document.getElementById("d"+o);d.className="door opened",d.querySelector(".icon").textContent=o===car?"🚗":"🐐",o===t&&d.classList.add(n?"won":"lost")}document.getElementById("msg").textContent=n?"You won the car!":"Goat!",document.getElementById("switchBtn").style.display="none",document.getElementById("stayBtn").style.display="none",document.getElementById("againBtn").style.display="",state="done"}document.getElementById("d0").addEventListener("click",(function(){pickDoor(0)})),document.getElementById("d1").addEventListener("click",(function(){pickDoor(1)})),document.getElementById("d2").addEventListener("click",(function(){pickDoor(2)})),document.getElementById("switchBtn").addEventListener("click",(function(){finish(!0)})),document.getElementById("stayBtn").addEventListener("click",(function(){finish(!1)})),document.getElementById("againBtn").addEventListener("click",init),init();</script> <!-- build 🥓🤨💠🦎🤣😭😣🐤⚜♐🌼😮🐭☝♈🍗🤜💓🤜😋😊💝😘👎😯🥕💅🐹🤪☺🌹🦋 -->
