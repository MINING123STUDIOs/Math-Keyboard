<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Keyboard</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6fa;
    --panel: #ffffff;
    --ink: #1e2430;
    --muted: #5b6472;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --border: #868ea0;
    --danger: #dc2626;
    --shadow: rgba(0, 0, 0, 0.05);
    --toast-bg: #111827;
    --toast-ink: #ffffff;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1117;
    --panel: #171a23;
    --ink: #e6e8ee;
    --muted: #8b93a7;
    --accent: #5a62ea;
    --accent-soft: #232a45;
    --border: #5f687b;
    --danger: #f87171;
    --shadow: rgba(0, 0, 0, 0.4);
    --toast-bg: #eef0f6;
    --toast-ink: #111827;
  }
  * { box-sizing: border-box; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 650;
    letter-spacing: 0.2px;
  }
  header .tagline { color: var(--muted); font-size: 13px; }
  .toolbar {
    margin-left: auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .05s;
  }
  button:hover { background: var(--accent-soft); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: #4338ca; }
  main { max-width: 980px; margin: 0 auto; padding: 20px; }
  .output-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 1px 3px var(--shadow);
  }
  textarea {
    width: 100%;
    min-height: 130px;
    border: none;
    resize: vertical;
    font-size: 22px;
    line-height: 1.6;
    font-family: "STIX Two Math", "Latin Modern Math", "DejaVu Sans Math", "Cambria Math", "Times New Roman", serif;
    color: var(--ink);
  }
  .recent {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .recent button {
    font-family: inherit;
    font-size: 17px;
    padding: 4px 9px;
    border-radius: 7px;
  }
  .search-row {
    margin: 16px 0 10px;
    display: flex;
    gap: 8px;
  }
  input[type="search"] {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    font-size: 14px;
    background: var(--panel);
  }
  input[type="search"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  textarea::placeholder, input[type="search"]::placeholder { color: var(--muted); }
  .tabs {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .tabs .group-row, .tabs .cat-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tabs button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .tabs .group-row button {
    font-weight: 650;
    padding: 7px 14px;
  }
  .tabs .group-row button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .tabs .cat-row button {
    font-size: 12px;
    padding: 5px 10px;
  }
  .tabs .cat-row button.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
    font-weight: 600;
  }
  .pad {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
    gap: 8px;
  }
  .grid button {
    min-height: 52px;
    font-size: 22px;
    font-family: "STIX Two Math", "Latin Modern Math", "DejaVu Sans Math", "Cambria Math", "Times New Roman", serif;
    padding: 4px;
    position: relative;
  }
  .grid button.text {
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    white-space: nowrap;
  }
  .grid button.wide {
    grid-column: span 2;
    font-size: 13px;
  }
  .grid button.wide3 {
    grid-column: span 3;
    font-size: 11px;
  }
  .grid button .name {
    position: absolute;
    bottom: 2px;
    left: 7.5%;
    right: 7.5%;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transition: opacity .15s;
  }
  .grid button:hover .name,
  .grid button:active .name,
  .grid button:focus .name { opacity: 1; }
  .empty {
    color: var(--muted);
    padding: 24px;
    text-align: center;
  }
  .count { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--toast-bg);
    color: var(--toast-ink);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (pointer: coarse) {
    .toolbar button {
      min-height: 44px;
      font-size: 15px;
      padding: 8px 14px;
    }
    .tabs .group-row button {
      min-height: 40px;
      font-size: 14px;
      padding: 8px 14px;
    }
    .tabs .cat-row button {
      min-height: 38px;
      font-size: 13px;
      padding: 6px 12px;
    }
    .search-row input {
      min-height: 44px;
      font-size: 16px;
    }
    .recent button {
      min-height: 38px;
      font-size: 19px;
      padding: 6px 11px;
    }
  }

  @media (max-width: 560px) {
    header {
      padding: 8px 12px;
      gap: 8px;
    }
    header .tagline { display: none; }
    main { padding: 12px; }
    .pad { padding: 10px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); }
  }
</style>
</head>
<body>
<header>
  <h1>&sum; Math Keyboard</h1>
  <span class="tagline">click symbols to insert them</span>
  <div class="toolbar">
    <button id="themeBtn" title="Toggle dark mode">&#9789;</button>
    <button id="copyBtn" class="primary">Copy</button>
    <button id="undoBtn">Undo</button>
    <button id="clearBtn">Clear</button>
    <button id="downloadBtn">Download</button>
  </div>
</header>

<main>
  <section class="output-wrap">
    <label class="sr-only" for="out">Math expression</label>
    <textarea id="out" placeholder="Type or click symbols…"></textarea>
    <div class="recent" id="recentBar"><span>Recent:</span></div>
  </section>

  <div class="search-row">
    <label class="sr-only" for="search">Search symbols</label>
    <input type="search" id="search" placeholder="Search symbols (e.g. integral, alpha, subset)…">
  </div>

  <nav class="tabs" id="tabs"></nav>

  <section class="pad">
    <div class="grid" id="grid"></div>
    <div class="count" id="count"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

const output = document.getElementById("out");
const grid = document.getElementById("grid");
const tabs = document.getElementById("tabs");
const search = document.getElementById("search");
const recentBar = document.getElementById("recentBar");
const countEl = document.getElementById("count");
const toast = document.getElementById("toast");

let currentGroup = "Frequently Used";
let currentTab = "__all";
let historyStack = [];
const MAX_HISTORY = 50;

function saveState() {
  historyStack.push(output.value);
  if (historyStack.length > MAX_HISTORY) historyStack.shift();
}

function restoreState() {
  const prev = historyStack.pop();
  if (prev !== undefined) {
    output.value = prev;
    updateCount();
  }
}

function insertAtCursor(text) {
  saveState();
  const start = output.selectionStart ?? output.value.length;
  const end = output.selectionEnd ?? output.value.length;
  const marker = text.indexOf("\u0001");
  const clean = marker === -1 ? text : text.replace(/\u0001/g, "");
  const next = output.value.slice(0, start) + clean + output.value.slice(end);
  output.value = next;
  const pos = marker === -1 ? start + clean.length : start + marker;
  output.setSelectionRange(pos, pos);
  output.focus({ preventScroll: true });
  updateCount();
  addRecent(clean);
}

function addRecent(symbol) {
  if (symbol.length > 12) return;
  let bar = Array.from(recentBar.querySelectorAll("button"));
  if (bar.some(b => b.dataset.s === symbol)) {
    const btn = bar.find(b => b.dataset.s === symbol);
    recentBar.appendChild(btn);
    return;
  }
  const btn = document.createElement("button");
  btn.dataset.s = symbol;
  btn.textContent = symbol;
  btn.title = symbol;
  btn.addEventListener("click", () => insertAtCursor(symbol));
  recentBar.appendChild(btn);
  while (recentBar.children.length > 13) recentBar.removeChild(recentBar.children[1]);
}

function updateCount() {
  countEl.textContent = output.value.length
    ? output.value.length + " character" + (output.value.length === 1 ? "" : "s")
    : "";
}

function render() {
  grid.innerHTML = "";
  const q = search.value.trim().toLowerCase();
  const cats = currentGroup === "__all"
    ? Object.keys(SYMBOLS)
    : GROUPS.find(g => g[0] === currentGroup)[1];
  const all = currentTab === "__all"
    ? cats.flatMap(cat => SYMBOLS[cat].map(s => [cat, ...s]))
    : SYMBOLS[currentTab].map(s => [currentTab, ...s]);

  const filtered = q ? all.filter(([, sym, name]) =>
    name.toLowerCase().includes(q) ||
    sym.replace(/\u0001/g, "").toLowerCase().includes(q)
  ) : all;

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">No symbols match "' + search.value + '"</div>';
    return;
  }
  for (const [cat, sym, name] of filtered) {
    const btn = document.createElement("button");
    const anchor = sym.indexOf("\u0001");
    const clean = anchor === -1 ? sym : sym.replace(/\u0001/g, "");
    btn.textContent = clean;
    btn.title = name + " (" + clean + ")";
    btn.dataset.sym = clean;
    const isComb = clean.codePointAt(0) >= 0x0300 && clean.codePointAt(0) <= 0x036f;
    let display = clean;
    if (clean.trim() === "" && clean.length <= 1) display = "\u2423";
    if (clean.length > 1 || clean.trim() === "") btn.classList.add("text");
    if (clean.length > 17) btn.classList.add("wide3");
    else if (clean.length > 6) btn.classList.add("wide");
    btn.innerHTML = '<span>' + (isComb ? "\u25cc" + clean : display) + '</span><span class="name">' + name + "</span>";
    btn.addEventListener("click", () => insertAtCursor(sym));
    grid.appendChild(btn);
  }
}

function buildTabs() {
  tabs.innerHTML = "";
  const groupRow = document.createElement("div");
  groupRow.className = "group-row";
  const allBtn = document.createElement("button");
  allBtn.textContent = "All";
  allBtn.classList.toggle("active", currentGroup === "__all");
  allBtn.addEventListener("click", () => {
    currentGroup = "__all";
    currentTab = "__all";
    buildTabs(); render();
  });
  groupRow.appendChild(allBtn);
  for (const [group] of GROUPS) {
    const b = document.createElement("button");
    b.textContent = group;
    b.classList.toggle("active", currentGroup === group);
    b.addEventListener("click", () => {
      currentGroup = group;
      const first = GROUPS.find(g => g[0] === group)[1][0];
      currentTab = first;
      buildTabs(); render();
    });
    groupRow.appendChild(b);
  }
  tabs.appendChild(groupRow);

  const catRow = document.createElement("div");
  catRow.className = "cat-row";
  const cats = currentGroup === "__all"
    ? Object.keys(SYMBOLS)
    : GROUPS.find(g => g[0] === currentGroup)[1];
  if (currentGroup !== "__all") {
    const b = document.createElement("button");
    b.textContent = "All";
    b.classList.toggle("active", currentTab === "__all");
    b.addEventListener("click", () => { currentTab = "__all"; buildTabs(); render(); });
    catRow.appendChild(b);
  }
  for (const cat of cats) {
    const b = document.createElement("button");
    b.textContent = cat;
    b.classList.toggle("active", currentTab === cat);
    b.addEventListener("click", () => { currentTab = cat; buildTabs(); render(); });
    catRow.appendChild(b);
  }
  tabs.appendChild(catRow);
}

search.addEventListener("input", render);

document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = output.value;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    showToast("Copied " + text.length + " characters");
  } catch {
    output.select();
    document.execCommand("copy");
    showToast("Copied");
  }
});

document.getElementById("undoBtn").addEventListener("click", restoreState);
document.getElementById("clearBtn").addEventListener("click", () => {
  if (output.value) { saveState(); output.value = ""; updateCount(); }
});
document.getElementById("downloadBtn").addEventListener("click", () => {
  const blob = new Blob([output.value], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "math-notes.txt";
  a.click();
  URL.revokeObjectURL(a.href);
  showToast("Downloaded");
});

output.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    restoreState();
  }
});

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
}

try {
  const saved = localStorage.getItem("math-keyboard-output");
  if (saved !== null) output.value = saved;
} catch (e) {}
output.addEventListener("input", () => {
  updateCount();
  try { localStorage.setItem("math-keyboard-output", output.value); } catch (e) {}
});

const themeBtn = document.getElementById("themeBtn");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeBtn.textContent = theme === "dark" ? "\u263c" : "\u263d";
  try { localStorage.setItem("math-keyboard-theme", theme); } catch (e) {}
}
let theme;
try { theme = localStorage.getItem("math-keyboard-theme"); } catch (e) {}
if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
applyTheme(theme);
themeBtn.addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

buildTabs();
render();
if (!matchMedia("(pointer: coarse)").matches) output.focus();
</script>
</body>
</html>
